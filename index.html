<style>
/* Layout: one centered booklet on a dark olive ground with a faint drafting grid.
   Wide screens show the booklet as a spread (cover / p2-p3 / back); narrow screens show one page at a time. */
:root {
  --ground: #2a2d1b;
  --ground-line: rgba(233, 232, 185, 0.05);
  --ink: #e9e8b9;
  --ink-dim: #a7a984;
  --olive: #84884f;
  --rust: #b4501a;
  --line: rgba(233, 232, 185, 0.28);
  --font-ui: "DotGothic16", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-text: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --pw: 300px;
  --ph: 600px;
  --turn: 0.9s;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  background-color: var(--ground);
  background-image:
    linear-gradient(var(--ground-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--ground-line) 1px, transparent 1px);
  background-size: 96px 96px;
  background-position: center center;
  color: var(--ink);
  font-family: var(--font-text);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#stage {
  flex: 1;
  min-height: 0;
  min-width: 0;
  display: grid;
  place-items: center;
  padding: 8px;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
}
#scene {
  width: calc(var(--pw) * 2);
  height: var(--ph);
  perspective: 2600px;
}
#stage.single #scene { width: var(--pw); }
#book {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transform: translateX(var(--shift, 0px));
  transition: transform var(--turn) cubic-bezier(0.45, 0.05, 0.25, 1);
}
.leaf {
  position: absolute;
  top: 0;
  width: var(--pw);
  height: var(--ph);
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform var(--turn) cubic-bezier(0.45, 0.05, 0.25, 1);
  cursor: pointer;
}
.spread .leaf { left: 50%; }
.spread .leaf.flipped { transform: rotateY(-180deg); }
.single .leaf { left: 0; transform-style: flat; }
.single .leaf.flipped {
  transform: rotateY(-100deg);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.7s cubic-bezier(0.45, 0.05, 0.25, 1), opacity 0.45s ease 0.2s;
}
.no-anim, .no-anim * { transition: none !important; }
.face {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--olive);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.38), 0 2px 6px rgba(0, 0, 0, 0.3);
}
.face.back { transform: rotateY(180deg); }
.face img {
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
  -webkit-user-drag: none;
}
.face::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(90deg, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0) 9%);
}
.spread .face.back::after { background: linear-gradient(270deg, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0) 9%); }
.hot {
  position: absolute;
  display: block;
  border-radius: 4px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.hot:hover, .hot:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
  background: rgba(233, 232, 185, 0.14);
}
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding-top: 10px;
}
.btn {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: background 0.2s, color 0.2s, opacity 0.2s;
}
.btn svg { width: 20px; height: 20px; }
.btn:hover:not(:disabled) { background: var(--ink); color: var(--ground); }
.btn:focus-visible, .stage-focus:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.btn:disabled { opacity: 0.28; cursor: default; }
.status {
  min-width: 9.5em;
  text-align: center;
  display: grid;
  gap: 2px;
}
.count {
  font-family: var(--font-ui);
  font-size: 1.25rem;
  letter-spacing: 0.12em;
  font-variant-numeric: tabular-nums;
}
.cap {
  font-size: 0.78rem;
  letter-spacing: 0.08em;
  color: var(--ink-dim);
}
.hint {
  margin: 8px 0 0;
  text-align: center;
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  color: var(--ink-dim);
  text-wrap: balance;
}
@media (prefers-reduced-motion: reduce) {
  :root { --turn: 0.01s; }
  .single .leaf.flipped { transition: none; }
}
</style>

      a.style.width = h.w + "%";
      a.style.height = h.h + "%";
      f.appendChild(a);

    return f;

    var groups = mode === "spread" ? [[0, 1], [2, 3]] : [[0], [1], [2], [3]];

      var leaf = document.createElement("div");
      leaf.className = "leaf";
      leaf.appendChild(makeFace(g[0], "front"));
      if (g.length > 1) leaf.appendChild(makeFace(g[1], "back"));
      book.appendChild(leaf);
      leaves.push(leaf);
    });
  }

    var n = leaves.length;
    leaves.forEach(function (el, k) {

      });
    } else {
      render(false);
    }
  }

  prevBtn.addEventListener("click", function () { go(v - 1); });
  nextBtn.addEventListener("click", function () { go(v + 1); });

  stage.addEventListener("click", function (e) {
    if (suppressClick) { suppressClick = false; return; }
    if (e.target.closest && e.target.closest("a")) return;
    var leaf = e.target.closest && e.target.closest(".leaf");
    if (!leaf) return;
    if (mode === "spread") {
